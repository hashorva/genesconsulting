<!doctype html>
<!--
  Link preview image (Open Graph / Twitter card), 1200x630.
  Rendered to public/brand/genes-consulting-og.png by build-og-image.ts.
  Colors and sizes: Tailwind v4 default theme variables only (the build script loads them
  from tailwindcss/theme.css), no custom values.
  Motif: lucide "waypoints" icon (the network icon used on the site).
  Everything that matters sits in the centre 630x630, because WhatsApp and some
  chat apps crop the thumbnail to a square.
-->
<html lang="it">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Noto Sans Variable";
    font-weight: 100 900;
    src: url("../../node_modules/@fontsource-variable/noto-sans/files/noto-sans-latin-wght-normal.woff2") format("woff2");
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    background: var(--color-sky-950);
    color: var(--color-white);
    font-family: "Noto Sans Variable", var(--font-sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing);
  }
  .net { position: absolute; color: var(--color-sky-900); }
  .net.left { width: calc(var(--spacing) * 96); left: calc(var(--spacing) * -40); top: calc(var(--spacing) * -12); }
  .net.right { width: calc(var(--spacing) * 96); right: calc(var(--spacing) * -40); bottom: calc(var(--spacing) * -12); }
  .mark { width: calc(var(--spacing) * 40); height: calc(var(--spacing) * 40); margin-bottom: calc(var(--spacing) * 6); }
  h1 { font-size: var(--text-6xl); line-height: var(--text-6xl--line-height); font-weight: var(--font-weight-bold); letter-spacing: var(--tracking-tight); }
  .rule { width: calc(var(--spacing) * 16); height: calc(var(--spacing) * 1.5); border-radius: var(--radius-full); background: var(--color-yellow-600); margin: calc(var(--spacing) * 4) 0; }
  p { font-size: var(--text-3xl); line-height: var(--text-3xl--line-height); font-weight: var(--font-weight-medium); color: var(--color-sky-200); }
</style>
</head>
<body>
  <svg class="net left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.586 5.414-5.172 5.172"/><path d="m18.586 13.414-5.172 5.172"/><path d="M6 12h12"/><circle cx="12" cy="20" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="20" cy="12" r="2"/><circle cx="4" cy="12" r="2"/></svg>
  <svg class="net right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.586 5.414-5.172 5.172"/><path d="m18.586 13.414-5.172 5.172"/><path d="M6 12h12"/><circle cx="12" cy="20" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="20" cy="12" r="2"/><circle cx="4" cy="12" r="2"/></svg>
  <img class="mark" src="../../public/brand/genes-consulting-logo.svg" alt="" />
  <h1>Genes Consulting</h1>
  <div class="rule"></div>
  <p>Meno complessità. Più impresa.</p>
</body>
</html>
