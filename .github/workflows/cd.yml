# Based on hashorva/cd-kit (pinned to v0). Public repo: GitHub-hosted runners only.
#
# - PR / push to main : CI only (lint, typecheck, test, build).
# - PR (same repo)    : preview = deploy to the separate preview Worker (own data).
# - push to main      : production deploy after CI passes. Unfinished features ship OFF (flags.json).
# - tag vX.Y.Z        : marks a release / re-deploys that exact commit (rollback).
# Deploy/preview jobs stay off until repo variable CD_DEPLOY_ENABLED = true.
name: cd

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # cd-kit ci.yml needs a lockfile (npm cache). Until the Astro app exists there is none,
  # so CI is skipped instead of failing. Remove this gate once package-lock.json is committed.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has-app: ${{ steps.d.outputs.has-app }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: d
        run: |
          if [[ -f package.json ]] && { [[ -f package-lock.json ]] || [[ -f pnpm-lock.yaml ]] || [[ -f yarn.lock ]] || [[ -f bun.lock ]] || [[ -f bun.lockb ]]; }; then
            echo "has-app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-app=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CI skipped::No package.json and lockfile yet."
          fi

  ci:
    needs: detect
    if: needs.detect.outputs.has-app == 'true'
    uses: hashorva/cd-kit/.github/workflows/ci.yml@v0
    with:
      runs-on: '"ubuntu-latest"'

  # Single required status check for branch protection. A skipped reusable-workflow job
  # reports as "ci", not "ci / ci", so requiring "ci / ci" would wait forever while CI is
  # skipped (no app yet). This job always runs and reports one stable name: gate.
  gate:
    if: always()
    needs: [detect, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check CI result
        env:
          DETECT: ${{ needs.detect.result }}
          CI: ${{ needs.ci.result }}
          HAS_APP: ${{ needs.detect.outputs.has-app }}
        run: |
          echo "detect=$DETECT ci=$CI has-app=$HAS_APP"
          [[ "$DETECT" == "success" ]] || { echo "::error::detect did not succeed"; exit 1; }
          if [[ "$HAS_APP" == "true" ]]; then
            [[ "$CI" == "success" ]] || { echo "::error::ci must succeed (got $CI)"; exit 1; }
          else
            echo "No app yet: CI skipped by design."
          fi

  preview:
    needs: ci
    if: >-
      vars.CD_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: hashorva/cd-kit/.github/workflows/deploy-cloudflare.yml@v0
    with:
      runs-on: '"ubuntu-latest"'
      environment: preview
      # Separate preview Worker (wrangler.jsonc env.preview) with its own D1/R2/KV,
      # so PR code never runs EmDash migrations against production content.
      # The Astro Cloudflare adapter picks the environment at build time.
      build-command: CLOUDFLARE_ENV=preview bun run build
      wrangler-command: deploy
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Every merge to main goes live; hidden features stay off via flags.json.
  deploy:
    needs: ci
    if: vars.CD_DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: hashorva/cd-kit/.github/workflows/deploy-cloudflare.yml@v0
    with:
      runs-on: '"ubuntu-latest"'
      environment: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Tag vX.Y.Z = a release. Pushing an older tag re-deploys it (rollback).
  release:
    needs: ci
    if: vars.CD_DEPLOY_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    uses: hashorva/cd-kit/.github/workflows/deploy-cloudflare.yml@v0
    with:
      runs-on: '"ubuntu-latest"'
      environment: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # EmDash core migrations, applied from CI right after each deploy instead of inside the
  # first visitor request (which Workers can cut off, leaving a stuck lock and a 503).
  # Additive schema only; never touches content. See scripts/emdash-migrate.sh.
  migrate-preview:
    needs: preview
    if: needs.preview.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    concurrency:
      group: emdash-migrate-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: scripts/emdash-migrate.sh genesconsulting-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  migrate-production:
    needs: [deploy, release]
    if: always() && (needs.deploy.result == 'success' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: emdash-migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: scripts/emdash-migrate.sh genesconsulting
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
