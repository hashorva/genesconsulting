# Based on hashorva/cd-kit (pinned to v0). Public repo: GitHub-hosted runners only.
#
# - PR / push to main : CI only (lint, typecheck, test, build).
# - PR (same repo)    : preview = new Worker version uploaded, NOT live.
# - tag vX.Y.Z        : production deploy (release). Merging to main never deploys.
# Deploy/preview jobs stay off until repo variable CD_DEPLOY_ENABLED = true.
name: cd

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # cd-kit ci.yml needs a lockfile (npm cache). Until the Astro app exists there is none,
  # so CI is skipped instead of failing. Remove this gate once package-lock.json is committed.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has-app: ${{ steps.d.outputs.has-app }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: d
        run: |
          if [[ -f package.json ]] && ls package-lock.json pnpm-lock.yaml yarn.lock bun.lock bun.lockb >/dev/null 2>&1; then
            echo "has-app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-app=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CI skipped::No package.json and lockfile yet."
          fi

  ci:
    needs: detect
    if: needs.detect.outputs.has-app == 'true'
    uses: hashorva/cd-kit/.github/workflows/ci.yml@v0
    with:
      runs-on: '"ubuntu-latest"'

  preview:
    needs: ci
    if: >-
      vars.CD_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: hashorva/cd-kit/.github/workflows/deploy-cloudflare.yml@v0
    with:
      runs-on: '"ubuntu-latest"'
      environment: preview
      wrangler-command: versions upload
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    needs: ci
    if: vars.CD_DEPLOY_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    uses: hashorva/cd-kit/.github/workflows/deploy-cloudflare.yml@v0
    with:
      runs-on: '"ubuntu-latest"'
      environment: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
