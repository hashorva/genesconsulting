# Advisory AI review of pull requests (adapted from hashorva/finduck's ai-review).
# The review itself is advisory; job `review-gate` (required check) turns its verdict into a merge gate.
# The review skips when secret CLAUDE_CODE_OAUTH_TOKEN is missing (also on forks).
# Model: Sonnet for ordinary PRs; Opus for *critical* PRs: labelled `risky`, >400 lines changed,
# or touching security/deploy/rules paths (RISKY_PATHS below). Docs-only PRs (docs/, README.md) and drafts are not reviewed.
# Job `review-gate` (required check) blocks merging until the review of the head SHA is clean,
# and, on critical PRs, until the owner adds the label `owner-ok` (AGENTS.md).
# pull_request only (never pull_request_target); no job runs PR code; GitHub-hosted runner.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled, unlabeled, auto_merge_enabled]

concurrency:
  # Ignored labels, label removals and auto-merge toggles get their own group so they never cancel a running review.
  group: ${{ ((github.event.action == 'labeled' && github.event.label.name != 'risky') || github.event.action == 'unlabeled' || github.event.action == 'auto_merge_enabled') && format('ai-review-ignored-{0}', github.run_id) || format('ai-review-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.scope.outputs.review }}
      model: ${{ steps.scope.outputs.model }}
      critical: ${{ steps.scope.outputs.critical }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Review or not, and which model
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_ADDED: ${{ github.event.label.name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # Edit here (data, not logic). Extended regex on file paths.
          RISKY_PATHS: '^\.github/|^(AGENTS|CLAUDE)\.md$|^\.agents/|^\.claude/|^\.mcp\.json$|(^|/)wrangler[^/]*\.(jsonc|toml)$|^astro\.config\.|^package(-lock)?\.json$|^bun\.lockb?$|^flags\.json$|^seed/|migrations?/|emdash-migrate|(^|/)(auth|session|middleware)[^/]*\.(ts|js|mjs|astro)$'
          MAX_LINES: "400"
          SONNET: claude-sonnet-5-5
          OPUS: claude-opus-5-5
        run: |
          set -euo pipefail
          out() {
            { echo "review=$1"; echo "model=$2"; echo "critical=$3"; echo "docs_only=${docs_only:-false}"; } >> "$GITHUB_OUTPUT"
            echo "review=$1 model=$2 critical=$3 docs_only=${docs_only:-false} reason=$4"
          }
          # Critical (Opus, never auto-merged): risky label, risky path, or too many lines.
          # Renamed files count under both their old and new path.
          critical=false; why=""
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | ([.filename, (.additions+.deletions)] | @tsv), (select(.previous_filename) | [.previous_filename, 0] | @tsv)'); then
            out true "$OPUS" true "cannot list files (fail safe)"; exit 0
          fi
          lines=$(echo "$files" | awk -F'\t' '{s+=$2} END{print s+0}')
          if [[ ",$LABELS," == *",risky,"* ]]; then critical=true; why="labelled risky"
          elif echo "$files" | cut -f1 | grep -qE "$RISKY_PATHS"; then critical=true; why="risky path"
          elif (( lines > MAX_LINES )); then critical=true; why="$lines lines"
          else why="$lines lines"; fi
          model=$SONNET; [[ "$critical" == true ]] && model=$OPUS
          # Docs-only (no review needed, passes review-gate): every file is under docs/ or is README.md.
          # Not any .md: Astro renders .md under astro-src/ as pages.
          docs_only=false
          if [[ "$critical" == false ]] && ! echo "$files" | cut -f1 | grep -qvE '^docs/|^README\.md$'; then docs_only=true; fi
          if [[ "$DRAFT" == "true" ]]; then out false "$model" "$critical" draft; exit 0; fi
          if [[ "$EVENT_ACTION" == "auto_merge_enabled" || "$EVENT_ACTION" == "unlabeled" ]]; then out false "$model" "$critical" "$EVENT_ACTION"; exit 0; fi
          if [[ "$EVENT_ACTION" == "labeled" && "$LABEL_ADDED" != "risky" ]]; then out false "$model" "$critical" "label ignored"; exit 0; fi
          if [[ "$docs_only" == true ]]; then out false "$model" "$critical" "docs only"; exit 0; fi
          out true "$model" "$critical" "$why"

  review:
    needs: scope
    if: needs.scope.outputs.review == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: No Claude token
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: echo "::notice title=AI review skipped::CLAUDE_CODE_OAUTH_TOKEN is not set (or this is a fork)."

      - uses: actions/checkout@v7
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read the review prompt
        id: prompt
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: |
          {
            echo "text<<REVIEW_PROMPT_EOF"
            cat .github/ai-review-prompt.md
            echo
            echo "Repository: ${{ github.repository }}"
            echo "Pull request number: ${{ github.event.pull_request.number }}"
            echo "Head commit: ${{ github.event.pull_request.head.sha }}"
            echo "REVIEW_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # Pin to a full commit SHA (as finduck does) when enabling; v1 shown for readability.
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ needs.scope.outputs.model }}
            --max-turns 30
            --setting-sources user
            --strict-mcp-config
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

  # Required check (branch protection on main, next to `gate`): a PR can merge, by hand
  # or by auto-merge, only once the AI review of its current head SHA said "No blocking
  # findings." (docs-only PRs need no review; without a Claude token it fails closed).
  # Critical PRs also need the label `owner-ok`, which only the owner adds (AGENTS.md);
  # a new push removes it, so the owner's OK covers exactly the commit they saw.
  # Always runs, also on ignored-label and auto-merge events, so the latest result
  # reflects the current labels and comments.
  review-gate:
    needs: [scope, review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_ACTION: ${{ github.event.action }}
      SCOPE_RESULT: ${{ needs.scope.result }}
      CRITICAL: ${{ needs.scope.outputs.critical }}
      DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      AI_REVIEW_OPTIONAL: ${{ vars.AI_REVIEW_OPTIONAL }}
    steps:
      - name: Critical PRs need the owner's OK; every PR needs a clean review of this head
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != "success" ]]; then echo "::error::scope job did not succeed"; exit 1; fi
          if [[ "$CRITICAL" == "true" ]]; then
            # Read labels live: the event payload can be stale.
            owner_ok=false
            if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx 'owner-ok'; then owner_ok=true; fi
            if [[ "$owner_ok" == true && "$EVENT_ACTION" == "synchronize" ]]; then
              gh api -X DELETE "repos/$REPO/issues/$PR/labels/owner-ok" > /dev/null
              owner_ok=false
              echo "::notice title=owner-ok removed::New commits on a critical PR need the owner's OK again."
            fi
            if [[ "$owner_ok" != true ]]; then
              echo "::error title=Critical PR::Waiting for the owner: they add the label owner-ok to allow merging this commit."
              exit 1
            fi
          fi
          if [[ "$DOCS_ONLY" == "true" ]]; then echo "Docs-only PR: no AI review needed."; exit 0; fi
          # Fail closed when no review can run (fork PRs get no secrets; a missing or expired
          # token). Deliberate opt-out for same-repo PRs: repo variable AI_REVIEW_OPTIONAL=true.
          if [[ "$HAS_CLAUDE_TOKEN" != "true" ]]; then
            if [[ "$AI_REVIEW_OPTIONAL" == "true" && "$FROM_FORK" != "true" ]]; then
              echo "::warning title=No AI review::CLAUDE_CODE_OAUTH_TOKEN missing; AI_REVIEW_OPTIONAL=true lets this pass."; exit 0
            fi
            echo "::error title=No AI review possible::No CLAUDE_CODE_OAUTH_TOKEN for this run (fork PR, or missing secret)."; exit 1
          fi
          # Match the reviewed SHA, not timestamps (committer dates are client-set).
          ok=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"No blocking findings\")) and (.body | contains(\"Reviewed: $SHA\"))) | .id" | wc -l)
          if (( ok == 0 )); then
            echo "::error title=No clean AI review of $SHA::Fix the findings (or wait for the review); a new push is reviewed again."
            exit 1
          fi
          echo "AI review of $SHA: no blocking findings."
