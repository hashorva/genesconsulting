# Advisory AI review of pull requests (adapted from hashorva/finduck's ai-review).
# Never a required check. Skips when secret CLAUDE_CODE_OAUTH_TOKEN is missing (also on forks).
# Model: Sonnet for ordinary PRs; Opus for *critical* PRs: labelled `risky`, >400 lines changed,
# or touching security/deploy/rules paths (RISKY_PATHS below). Docs-only and draft PRs are not reviewed.
# Critical PRs never auto-merge: job `merge-policy` turns auto-merge off on them (AGENTS.md).
# pull_request only (never pull_request_target); no job runs PR code; GitHub-hosted runner.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled, auto_merge_enabled]

concurrency:
  # Ignored labels and auto-merge toggles get their own group so they never cancel a running review.
  group: ${{ ((github.event.action == 'labeled' && github.event.label.name != 'risky') || github.event.action == 'auto_merge_enabled') && format('ai-review-ignored-{0}', github.run_id) || format('ai-review-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.scope.outputs.review }}
      model: ${{ steps.scope.outputs.model }}
      critical: ${{ steps.scope.outputs.critical }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Review or not, and which model
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_ADDED: ${{ github.event.label.name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # Edit here (data, not logic). Extended regex on file paths.
          RISKY_PATHS: '^\.github/|^(AGENTS|CLAUDE)\.md$|(^|/)wrangler[^/]*\.(jsonc|toml)$|^astro\.config\.|^package(-lock)?\.json$|^bun\.lockb?$|^flags\.json$|^seed/|migrations?/|emdash-migrate|(^|/)(auth|session|middleware)[^/]*\.(ts|js|mjs|astro)$'
          MAX_LINES: "400"
          SONNET: claude-sonnet-5-5
          OPUS: claude-opus-5-5
        run: |
          set -euo pipefail
          out() {
            { echo "review=$1"; echo "model=$2"; echo "critical=$3"; echo "docs_only=${docs_only:-false}"; } >> "$GITHUB_OUTPUT"
            echo "review=$1 model=$2 critical=$3 docs_only=${docs_only:-false} reason=$4"
          }
          # Critical (Opus, never auto-merged): risky label, risky path, or too many lines.
          critical=false; why=""
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | [.filename, (.additions+.deletions)] | @tsv'); then
            out true "$OPUS" true "cannot list files (fail safe)"; exit 0
          fi
          lines=$(echo "$files" | awk -F'\t' '{s+=$2} END{print s+0}')
          if [[ ",$LABELS," == *",risky,"* ]]; then critical=true; why="labelled risky"
          elif echo "$files" | cut -f1 | grep -qE "$RISKY_PATHS"; then critical=true; why="risky path"
          elif (( lines > MAX_LINES )); then critical=true; why="$lines lines"
          else why="$lines lines"; fi
          model=$SONNET; [[ "$critical" == true ]] && model=$OPUS
          # Docs-only: every file is markdown or under docs/ (and none is critical, e.g. AGENTS.md)
          docs_only=false
          if [[ "$critical" == false ]] && ! echo "$files" | cut -f1 | grep -qvE '\.md$|^docs/'; then docs_only=true; fi
          if [[ "$DRAFT" == "true" ]]; then out false "$model" "$critical" draft; exit 0; fi
          if [[ "$EVENT_ACTION" == "auto_merge_enabled" ]]; then out false "$model" "$critical" "auto-merge toggled"; exit 0; fi
          if [[ "$EVENT_ACTION" == "labeled" && "$LABEL_ADDED" != "risky" ]]; then out false "$model" "$critical" "label ignored"; exit 0; fi
          if [[ "$docs_only" == true ]]; then out false "$model" "$critical" "docs only"; exit 0; fi
          out true "$model" "$critical" "$why"

  # Auto-merge policy (AGENTS.md): critical PRs wait for the owner's click, and a
  # non-critical PR may auto-merge only after the AI review of its current head said
  # "No blocking findings". Otherwise auto-merge is turned off; the agent re-enables it
  # once the review has posted. Runs only when auto-merge is on.
  merge-policy:
    needs: scope
    if: github.event.pull_request.auto_merge != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
      CRITICAL: ${{ needs.scope.outputs.critical }}
      DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Keep auto-merge only where allowed
        run: |
          set -euo pipefail
          off() { gh pr merge "$PR" --repo "$REPO" --disable-auto; echo "::notice title=Auto-merge disabled::$1"; }
          if [[ "$CRITICAL" == "true" ]]; then off "Critical PR: it waits for the owner to merge."; exit 0; fi
          if [[ "$DOCS_ONLY" == "true" || "$HAS_CLAUDE_TOKEN" != "true" ]]; then echo "No AI review expected; auto-merge stays on."; exit 0; fi
          head_date=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.committer.date)
          ok=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .updated_at > \"$head_date\" and (.body | startswith(\"No blocking findings\"))) | .id" | wc -l)
          if (( ok == 0 )); then off "No clean AI review of the current head yet: re-enable auto-merge after it posts \"No blocking findings.\""; exit 0; fi
          echo "AI review of the current head is clean; auto-merge stays on."

  review:
    needs: scope
    if: needs.scope.outputs.review == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: No Claude token
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: echo "::notice title=AI review skipped::CLAUDE_CODE_OAUTH_TOKEN is not set (or this is a fork)."

      - uses: actions/checkout@v7
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read the review prompt
        id: prompt
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: |
          {
            echo "text<<REVIEW_PROMPT_EOF"
            cat .github/ai-review-prompt.md
            echo
            echo "Repository: ${{ github.repository }}"
            echo "Pull request number: ${{ github.event.pull_request.number }}"
            echo "REVIEW_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # Pin to a full commit SHA (as finduck does) when enabling; v1 shown for readability.
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ needs.scope.outputs.model }}
            --max-turns 30
            --setting-sources user
            --strict-mcp-config
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
